<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Edit | Sustainability, made simple.</title>
<meta name="description" content="The Edit. Sustainability, made simple. Coming soon.">
<meta name="theme-color" content="#D3DAD4">
<link rel="icon" href="seal.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage-pale: #D3DAD4;
    --sage: #677F68;
    --forest: #222D22;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sage-pale);
    color: var(--forest);
    font-family: "Quicksand", "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px 32px;
  }
  .wordmark {
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    font-size: clamp(2.6rem, 9vw, 4.5rem);
    line-height: 1;
    border: 3px solid var(--forest);
    padding: 0.18em 0.42em 0.26em;
    margin: 0;
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  .seal {
    width: min(58vw, 260px);
    height: auto;
    margin: 40px 0 28px;
    border-radius: 50%;
  }
  .tagline {
    font-size: clamp(1.25rem, 4.6vw, 1.75rem);
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }
  .definition {
    max-width: 30ch;
    margin: 0 auto 34px;
    font-size: 1rem;
    line-height: 1.6;
    color: #3d4b3e;
  }
  .definition em { font-family: "EB Garamond", Georgia, serif; font-size: 1.15em; }
  .soon {
    display: inline-block;
    background: var(--forest);
    color: var(--sage-pale);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 12px 26px 12px 30px;
    border-radius: 999px;
  }
  footer {
    background: var(--sage);
    color: #eef2ee;
    text-align: center;
    padding: 22px 24px;
    font-size: 0.95rem;
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(238,242,238,.5); }
  footer span { display: block; margin-bottom: 6px; font-weight: 300; }
</style>
</head>
<body>
  <main>
    <h1 class="wordmark">The Edit</h1>
    <img class="seal" src="seal.png" width="260" height="260" alt="Verified by The Edit butterfly seal">
    <p class="tagline">Sustainability, made simple.</p>
    <p class="definition"><em>Edit:</em> to change something in order to improve it.</p>
    <div class="soon">Coming soon</div>
  </main>
  <footer>
    we protect <strong>our</strong> home
  </footer>
</body>
</html>
